<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사능력검정시험 (심화) · 회차별 학습 기록</title>
<style>
:root{
  --bg:#f5f1ea; --paper:#fefcf7; --ink:#2c2620; --ink-soft:#6b6358;
  --accent:#8b1d1d; --accent-dark:#6b1414; --line:#ddd5c7;
  --shadow:0 2px 12px rgba(60,40,20,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%);color:#fefcf7;
  padding:22px 16px;text-align:center;margin-bottom:16px;border-radius:8px;box-shadow:var(--shadow)}
header .badge{display:inline-block;background:rgba(255,255,255,0.15);padding:4px 14px;border-radius:20px;
  font-size:13px;letter-spacing:1px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.25)}
header h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
header .subtitle{font-size:14px;opacity:0.9}
.round-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.round-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px;transition:all .2s;
  box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block}
.round-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-dark))}
.round-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 20px rgba(139,29,29,0.12)}
.round-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.round-card .year{font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.round-card .round-num{font-size:28px;font-weight:700;color:var(--accent);margin:4px 0;letter-spacing:-1px}
.round-card .round-num small{font-size:15px;color:var(--ink-soft);font-weight:500}
.round-card .round-date{font-size:12px;color:var(--ink-soft);margin-top:6px}
.warn{background:#fbe9e7;border:1px solid #e8b9b4;color:#b8392e;border-radius:6px;padding:10px 12px;font-size:13px}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-soft);padding:16px}
@media (max-width:480px){header h1{font-size:18px}.wrap{padding:10px}.round-card{padding:16px}.round-card .round-num{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">한국사능력검정시험</span>
    <h1>심화 · 회차별 학습 기록</h1>
    <div class="subtitle" id="sub"></div>
  </header>
  <div class="round-grid" id="grid"></div>
  <footer>출처 : 국사편찬위원회 · 한국사능력검정시험 (심화)</footer>
</div>
<script src="data/rounds.js"></script>
<script>
/* 생성물: src/template_index.html 을 build.py 가 복사한 파일입니다. 직접 수정하지 마십시오. */
const R = (window.ROUNDS || []).slice().sort((a,b)=>b.round-a.round);
document.getElementById("sub").textContent = R.map(r=>r.round).join(" · ") + "회";
document.getElementById("grid").innerHTML = R.length ? R.map(r=>`
  <a class="round-card" href="round_${r.round}.html">
    <div class="year">${(r.date||"").slice(0,4)}${r.date?"년":""}</div>
    <div class="round-num">${r.round}<small>회</small></div>
    <div class="round-date">${r.date||""}</div>
  </a>`).join("") : `<div class="warn">data/rounds.js 를 읽지 못했습니다. 웹앱_빌드.bat 을 다시 실행하세요.</div>`;
</script>
</body>
</html>
