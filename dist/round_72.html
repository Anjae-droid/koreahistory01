<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제72회 심화 · 학습 기록</title>
<style>
:root{
  --bg:#f5f1ea; --paper:#fefcf7; --ink:#2c2620; --ink-soft:#6b6358;
  --accent:#8b1d1d; --accent-dark:#6b1414; --line:#ddd5c7;
  --correct:#2d6e3f; --wrong:#b8392e;
  --shadow:0 2px 12px rgba(60,40,20,0.08);
  --A:#2d6e3f; --B:#a8701a; --C:#b8392e; --D:#6b6358;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px}

header{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%);color:#fefcf7;
  padding:22px 16px;text-align:center;margin-bottom:16px;border-radius:8px;box-shadow:var(--shadow)}
header .badge{display:inline-block;background:rgba(255,255,255,0.15);padding:4px 14px;border-radius:20px;
  font-size:13px;letter-spacing:1px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.25)}
header h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
header .subtitle{font-size:14px;opacity:0.9}

h2{font-size:16px;margin:20px 0 10px;color:var(--ink)}
.muted{color:var(--ink-soft);font-size:13px}

.modes{display:flex;flex-direction:column;gap:10px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow)}
.mode h3{font-size:16px;font-weight:700;margin-bottom:2px}
.mode p{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink);transition:all .2s}
.btn:hover{opacity:.9}
a.btn{text-decoration:none;display:inline-block}
.btn.primary,.btn.omr.primary{background:var(--accent);color:#fefcf7;border-color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:400}
.btn.ghost:hover{background:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.modes .btnrow .btn{flex:1}
.resume{background:var(--paper);border:1.5px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.warn{background:#fbe9e7;border:1px solid #e8b9b4;color:var(--wrong);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.bar{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);flex-wrap:wrap;gap:8px}
.bar .left,.bar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{background:var(--accent);color:#fefcf7;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.tag.subtle{background:var(--bg);color:var(--ink-soft)}
.progress-text{font-size:13px;color:var(--ink-soft);font-weight:600}
.clock{font-size:15px;font-weight:700;color:var(--ink)}
.clock.low{color:var(--wrong)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:var(--shadow)}
.qimg{width:100%;text-align:center;background:#fff;border-radius:6px;overflow:hidden}
.qimg img{width:100%;height:auto;display:block}

.bubbles{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bub{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:12px 4px;font-size:17px;font-weight:600;color:var(--ink);transition:all .15s}
.bub:hover:not(:disabled){border-color:var(--accent);background:#fbf6ec}
.bub:disabled{cursor:default}
.bub.picked{border-color:var(--accent);background:#fbf6ec}
.bub.correct{border-color:var(--correct);background:#e8f4ec;color:var(--correct)}
.bub.picked.wrong{border-color:var(--wrong);background:#fbe9e7;color:var(--wrong)}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px}

.panel{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{padding:12px 16px;border-radius:6px;font-size:14px;font-weight:600;text-align:center}
.verdict.ok{background:#e8f4ec;color:var(--correct);border:1px solid #b8d8c1}
.verdict.no{background:#fbe9e7;color:var(--wrong);border:1px solid #e8b9b4}
.verdict span{margin-left:6px;font-weight:600}
.sec{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.sec-t{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.sec-t em{font-style:normal;font-weight:600;color:var(--wrong)}
.sec-t em.done{color:var(--correct)}
.rx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rxb{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:8px 4px;text-align:center;line-height:1.3;transition:all .15s}
.rxb b{display:block;font-size:17px}
.rxb small{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.rxb:hover:not(:disabled){border-color:var(--accent)}
.rxb:disabled{opacity:.3;cursor:not-allowed}
.rxb.on[data-k="A"]{border-color:var(--A);background:#e8f4ec;color:var(--A)}
.rxb.on[data-k="B"]{border-color:var(--B);background:#fbf1de;color:var(--B)}
.rxb.on[data-k="C"]{border-color:var(--C);background:#fbe9e7;color:var(--C)}
.rxb.on[data-k="D"]{border-color:var(--D);background:var(--bg);color:var(--ink)}
.meta{font-size:13px;background:var(--bg);border-radius:6px;padding:7px 10px;margin-bottom:8px;color:var(--ink-soft)}
.meta b{color:var(--accent)}
.note{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-size:14px;background:var(--paper)}
.note:focus{border-color:var(--accent)}
.note:disabled{background:var(--bg)}
.sec.exp-box{background:#fdf6e3;border-color:#e8dcc4}
.sec.exp-box .sec-t::before{content:'📝';margin-right:6px}
.sec.exp-box .sec-t{justify-content:flex-start}
.exp{white-space:pre-wrap;font-size:14px;line-height:1.7}
.exp.none{color:var(--ink-soft);font-style:italic;font-size:13px}
.sec.exp-box .sec-t .exp-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.exp-mine{font-size:11.5px;font-weight:600;color:var(--B);background:#fbf1de;border-radius:10px;padding:1px 8px}
.exp-edit{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-size:14px;line-height:1.7;background:var(--paper);resize:vertical}
.exp-edit:focus{border-color:var(--accent);outline:none}
.exp-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.exp-btns .btn{padding:8px 14px;font-size:13px}

.nav{display:flex;gap:8px;margin-top:12px}
.nav .btn{flex:1;border-radius:6px}
.need{font-size:12.5px;color:var(--wrong);text-align:right;margin-top:6px;min-height:18px}

.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow)}
.cell{border:1px solid var(--line);border-radius:4px;background:#fff;padding:5px 0;text-align:center;font-size:12px;line-height:1.2}
.cell b{display:block;font-size:13px}
.cell.filled{background:#fbf6ec;border-color:var(--accent)}
.cell.cur{outline:2px solid var(--ink)}
.cell.ok{background:#e8f4ec;border-color:var(--correct)}
.cell.no{background:#fbe9e7;border-color:var(--wrong)}
.cell.pending b::after{content:" •";color:var(--wrong)}

.summary{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px;text-align:center;box-shadow:var(--shadow)}
.summary h2{font-size:20px;margin:0 0 6px;color:var(--accent)}
.score-circle{width:130px;height:130px;margin:16px auto;border-radius:50%;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#fefcf7;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-circle .num{font-size:36px;font-weight:700;line-height:1}
.score-circle .label{font-size:13px;margin-top:4px;opacity:.9}
.summary-stats{display:flex;justify-content:space-around;margin:16px 0 4px;font-size:14px}
.summary-stats span{display:block}
.summary-stats .stat-num{font-size:22px;font-weight:700;margin-bottom:2px}
.summary-stats .stat-label{color:var(--ink-soft);font-size:12px}
.ladder{display:flex;margin-top:14px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ladder div{flex:1;text-align:center;padding:6px 2px;font-size:12px;border-right:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.ladder div:last-child{border-right:0}
.ladder div.hit{background:var(--accent);color:#fefcf7;font-weight:700}
.ladder div b{display:block;font-size:14px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.counts div{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;font-size:12px;color:var(--ink-soft)}
.counts b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:13px;border-radius:8px;overflow:hidden}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:center}
th{background:var(--bg);color:var(--ink-soft);font-weight:600}
.tblwrap{overflow-x:auto;box-shadow:var(--shadow);border-radius:8px}
textarea.out{width:100%;min-height:220px;font:inherit;font-size:13px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);white-space:pre}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fefcf7;padding:10px 16px;border-radius:6px;font-size:14px;display:none;z-index:20}
.toast.show{display:block}
.linkish{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-size:13px;padding:2px}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-soft);padding:16px}

@media (max-width:480px){
  header h1{font-size:18px}
  .wrap{padding:10px}
  .bubbles{gap:4px}
  .bub{padding:10px 2px;font-size:16px}
  .sheet{grid-template-columns:repeat(5,1fr)}
  .rxb small{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="data/72/data.js"></script>
<script>
/* 생성물: src/template_round.html 을 build.py 가 변환한 파일입니다. 직접 수정하지 마십시오. */
const D = window.ROUND_DATA || {round:72, date:"", problems:[]};
const ROUND = D.round;
const EXAM_DATE = D.date;
const P = D.problems;
const BY = {}; P.forEach(p => BY[p.n] = p);
const ERAS = ["전삼국","삼국","남북국","고려","조선","개항기","일제강점기","해방이후","미분류"];
const CIR = ["","①","②","③","④","⑤"];
const RX = {A:"바로 맞음",B:"헷갈렸는데 맞음",C:"두 선지에서 틀림",D:"아예 모름"};
const RXS = {A:"바로 맞음",B:"헷갈려 맞음",C:"둘 중 틀림",D:"아예 모름"};
const KEY = "hkh.sessions.v1";
const EXKEY = "hkh.exps.v1";      // 풀이 화면에서 작성한 해설 {"회차-번호": {t, at}} — 해설_추가.bat 로 문항.csv 에 반영
const EXAM_MS = 80*60*1000;

/* ---------- 저장 ---------- */
let storageOK = true;
function loadAll(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : []; }catch(e){ storageOK=false; return []; } }
function saveAll(list){ try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){ storageOK=false; } }
let ALL = loadAll();
/* ---------- 화면에서 작성한 해설 ---------- */
function loadExps(){ try{ const v=localStorage.getItem(EXKEY); return v?JSON.parse(v):{}; }catch(e){ return {}; } }
function saveExps(){ try{ localStorage.setItem(EXKEY, JSON.stringify(EXPS)); }catch(e){ storageOK=false; } }
let EXPS = loadExps();
(function(){ let ch=false;             // 이미 문항.csv 에 반영되어 빌드된 해설은 목록에서 지운다
  P.forEach(p=>{ const k=ROUND+"-"+p.n; if(EXPS[k] && EXPS[k].t.trim()===(p.x||"").trim()){ delete EXPS[k]; ch=true; } });
  if(ch) saveExps(); })();
let editExp = null, expDraft = "";
function expOf(n){ const m=EXPS[ROUND+"-"+n]; return m ? m.t : (BY[n].x||""); }
function isMine(n){ return !!EXPS[ROUND+"-"+n]; }
function startExp(n){ editExp=n; expDraft=expOf(n); renderQuiz(true, ()=>{ const t=$("#expEdit"); if(t){ t.focus({preventScroll:true}); t.setSelectionRange(t.value.length,t.value.length); } }); }
function cancelExp(){ editExp=null; renderQuiz(true); }
function saveExp(n){
  const t=expDraft.trim();
  if(t===(BY[n].x||"").trim()) delete EXPS[ROUND+"-"+n];
  else EXPS[ROUND+"-"+n]={t, at:Date.now()};
  saveExps(); editExp=null; renderQuiz(true); toast("해설을 저장했습니다.");
}
function revertExp(n){ if(!confirm("작성한 해설을 지우고 원래 해설로 되돌릴까요?")) return; delete EXPS[ROUND+"-"+n]; saveExps(); editExp=null; renderQuiz(true); }
function exportExps(){
  const items=Object.entries(EXPS).map(([k,v])=>{ const [r,n]=k.split("-").map(Number); return {round:r,n,text:v.t,updatedAt:v.at}; })
    .sort((a,b)=>a.round-b.round||a.n-b.n);
  const blob=new Blob([JSON.stringify({type:"hkh-explanations",version:1,exported:Date.now(),items},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`한능검_해설_${fmtDate(Date.now()).slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
let S = null;          // 현재 세션
let view = "home";
let showSheet = false;
let EDIT = null;       // 마친 기록 수정 중 {list, cur} — 답은 고정, 반응·1줄 기록만 고친다
function persist(){ if(!S) return; const i = ALL.findIndex(x=>x.id===S.id); if(i<0) ALL.push(S); else ALL[i]=S; saveAll(ALL); }

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function nums(s){ const a=[]; for(let i=s.s;i<=s.e;i++) a.push(i); return a; }
function mmss(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+":"+String(s).padStart(2,"0"); }
function mins(ms){ return Math.max(1,Math.round(ms/60000)); }
function fmtDate(ts){ const d=new Date(ts); const w="일월화수목금토"[d.getDay()]; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}(${w})`; }
function modeLabel(s){ return s.mode==="exam" ? "실전 80분" : `연습 ${s.s}~${s.e}번`; }
function qList(){ return EDIT ? EDIT.list : nums(S); }
function qCur(){ return EDIT ? EDIT.cur : S.cur; }
function item(n){ if(!S.items[n]) S.items[n]={}; return S.items[n]; }
function graded(n){ return S.mode==="exam" ? S.submitted : !!(S.items[n] && S.items[n].pick); }
function isRight(n){ const it=S.items[n]; return !!(it && it.pick===BY[n].a); }
function needsNote(n){ const it=S.items[n]||{}; return it.rx && it.rx!=="A"; }
function complete(n){ const it=S.items[n]||{}; if(!it.rx) return false; return it.rx==="A" || !!(it.note||"").trim(); }
function missingMsg(n){ const it=S.items[n]||{}; if(!it.rx) return "문항 반응을 먼저 고르세요."; if(needsNote(n) && !(it.note||"").trim()) return "B·C·D는 1줄 기록이 필수입니다."; return ""; }

/* ---------- 시계 (실전 전용) ---------- */
setInterval(()=>{
  if(!S || S.finished || view!=="quiz" || S.mode!=="exam" || S.submitted) return;
  S.examMs += 1000;
  if(S.examMs >= EXAM_MS){ submitExam(true); return; }
  const c=$("#clock"); if(c){ c.textContent=mmss(EXAM_MS-S.examMs); c.classList.toggle("low", EXAM_MS-S.examMs<10*60000); }
  if(S.examMs % 10000 === 0) persist();
},1000);

/* ---------- 화면: 홈 ---------- */
function renderHome(){
  view="home"; EDIT=null;
  const open = ALL.filter(x=>x.round===ROUND && !x.finished);
  const done = ALL.filter(x=>x.round===ROUND && x.finished);
  let h = `<div class="bar"><div class="left"><a class="btn ghost" href="index.html">← 회차 선택</a></div></div>` + mast();
  if(!P.length) h += `<div class="warn">data/${ROUND}/data.js 를 읽지 못했습니다. 웹앱_빌드.bat 을 다시 실행하세요.</div>`;
  if(!storageOK) h += `<div class="warn">이 브라우저에서는 기록이 저장되지 않습니다. 세션이 끝나면 반드시 결과 화면에서 기록을 복사해 두세요.</div>`;
  open.forEach(o=>{
    const cnt = Object.values(o.items).filter(i=>i.pick).length;
    h += `<div class="resume"><div><b>진행 중: ${modeLabel(o)}</b><div class="muted">${fmtDate(o.startedAt)} 시작 · ${cnt}문항 응답${o.mode==="exam"&&!o.submitted?` · 남은 시간 ${mmss(EXAM_MS-o.examMs)}`:""}</div></div>
      <div class="btnrow"><button class="btn primary" onclick="resume('${o.id}')">이어서 풀기</button><button class="btn ghost" onclick="dropSession('${o.id}')">삭제</button></div></div>`;
  });
  h += `<div class="modes">
    <div class="mode"><h3>연습 (평일)</h3><p>문항마다 바로 채점하고, 반응 분류와 1줄 기록을 남깁니다.</p>
      <div class="btnrow"><button class="btn primary" onclick="start('practice',1,25)">1~25번</button><button class="btn primary" onclick="start('practice',26,50)">26~50번</button><button class="btn" onclick="start('practice',1,50)">전체</button></div></div>
    <div class="mode"><h3>실전 (주말·공휴일)</h3><p>80분 동안 50문항을 풀고, 제출 후 문항별로 기록합니다.</p>
      <div class="btnrow"><button class="btn omr primary" onclick="start('exam',1,50)">80분 실전 시작</button></div></div>
  </div>`;
  h += `<h2>이 회차 기록 ${done.length ? "("+done.length+")" : ""}</h2>`;
  h += done.length ? recordsTable(done) : `<p class="muted">아직 끝낸 기록이 없습니다. 위에서 연습이나 실전을 시작하세요.</p>`;
  h += `<h2>백업</h2><p class="muted" style="margin-bottom:8px">기록은 이 기기의 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업하세요.</p>
    <div class="btnrow"><button class="btn" onclick="backup()">백업 파일 받기</button><button class="btn" onclick="$('#restore').click()">백업 불러오기</button>
    <input type="file" id="restore" accept=".json" style="display:none" onchange="restore(this)"></div>`;
  const nAll=Object.keys(EXPS).length, nHere=Object.keys(EXPS).filter(k=>k.startsWith(ROUND+"-")).length;
  h += `<h2>작성한 해설</h2><p class="muted" style="margin-bottom:8px">${nAll?`반영 전 해설 ${nAll}개 (이 회차 ${nHere}개)`:"반영 전 해설이 없습니다."}</p>
    <div class="btnrow"><button class="btn" ${nAll?"":"disabled"} onclick="exportExps()">해설 파일 받기</button></div>`;
  $("#app").innerHTML = h;
  window.scrollTo(0,0);
}
function mast(){
  return `<header><span class="badge">${EXAM_DATE.slice(0,4)}년</span><h1>제${ROUND}회 한국사능력검정시험</h1><div class="subtitle">심화 · 연습과 실전 기록</div></header>`;
}
function recordsTable(list){
  const rows = list.slice().sort((a,b)=>b.startedAt-a.startedAt).map(s=>{
    const st=stats(s);
    return `<tr><td>${fmtDate(s.startedAt).slice(5)}</td><td>${modeLabel(s)}</td><td>${st.got}/${st.max}</td><td>${st.rx.B}</td><td>${st.rx.C}</td><td>${s.mode==="exam"?mins(s.examUsedMs||s.examMs)+"분":"-"}</td>
      <td><button class="linkish" onclick="openResult('${s.id}')">보기</button> <button class="linkish" onclick="editRecord('${s.id}')">수정</button> <button class="linkish" onclick="dropSession('${s.id}')">삭제</button></td></tr>`;
  }).join("");
  return `<div class="tblwrap"><table><thead><tr><th>날짜</th><th>모드</th><th>점수</th><th>B</th><th>C</th><th>풀이 시간</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- 세션 제어 ---------- */
function start(mode,s,e){
  const open = ALL.find(x=>x.round===ROUND && !x.finished);
  if(open && !confirm("진행 중인 기록이 있습니다. 새로 시작할까요? (진행 중인 기록은 그대로 남습니다)")) return;
  S = {id:Date.now().toString(36), round:ROUND, mode, s, e, startedAt:Date.now(), examMs:0, cur:0, submitted:false, finished:false, items:{}};
  EDIT=null; persist(); showSheet=false; renderQuiz();
}
function resume(id){ S = ALL.find(x=>x.id===id); EDIT=null; showSheet=false; renderQuiz(); }
function editRecord(id){                 // 마친 기록: 푼 문항(실전은 50문항)의 반응·1줄 기록을 추가·수정
  const s=ALL.find(x=>x.id===id); if(!s) return;
  const list=stats(s).list; if(!list.length){ toast("고칠 문항이 없습니다."); return; }
  S=s; const i=list.findIndex(n=>!complete(n));
  EDIT={list, cur:Math.max(0,i)}; editExp=null; showSheet=true; renderQuiz();
}
function finishEdit(){ persist(); const s=S; renderResult(s); toast("기록을 저장했습니다."); }
function dropSession(id){ if(!confirm("이 기록을 삭제할까요? 되돌릴 수 없습니다.")) return; ALL=ALL.filter(x=>x.id!==id); saveAll(ALL); if(S&&S.id===id) S=null; renderHome(); }

/* ---------- 화면: 풀이 ---------- */
function renderQuiz(keep, after){
  // keep=true: 같은 문항 갱신(답·반응 선택) → 스크롤 유지 / 기본: 문항 이동 → 맨 위
  const y0 = window.scrollY;
  view="quiz";
  const list = qList(), cur = qCur(), n = list[cur], p = BY[n], it = S.items[n]||{};
  const exam = S.mode==="exam", examLive = exam && !S.submitted, g = graded(n);
  const title = EDIT ? `${modeLabel(S)} · 기록 수정` : exam ? (S.submitted ? "실전 기록 작성" : "실전 80분") : modeLabel(S);
  let h = `<div class="bar"><div class="left">
      ${EDIT ? `<button class="btn ghost" onclick="finishEdit()">← 수정 마치기</button>` : examLive ? `` : `<button class="btn ghost" onclick="quitEarly()">← ${exam?'기록 마치기':'그만하기'}</button>`}
      <span class="tag">제${ROUND}회</span><span class="tag subtle">${title}</span></div>
    <div class="right"><span class="progress-text">${cur+1} / ${list.length} · Q${n}</span>
    ${examLive ? `<span class="clock ${EXAM_MS-S.examMs<600000?'low':''}" id="clock">${mmss(EXAM_MS-S.examMs)}</span><button class="btn primary" style="padding:6px 12px;border-radius:6px" onclick="submitExam(false)">제출</button>` : ``}</div></div>`;
  h += `<div class="card"><div class="qimg"><img src="data/${ROUND}/img/q${String(n).padStart(2,"0")}.jpg" alt="${ROUND}회 ${n}번 문제"></div>`;
  h += `<div class="bubbles">` + [1,2,3,4,5].map(k=>{
    let c="bub"; if(it.pick===k) c+=" picked";
    if(g){ if(k===p.a) c+=" correct"; if(it.pick===k && k!==p.a) c+=" wrong"; }
    return `<button class="${c}" ${g?"disabled":""} onclick="pick(${n},${k})" aria-label="${k}번 선택">${CIR[k]}</button>`;
  }).join("") + `</div>`;
  if(!g) h += `<p class="hint">${examLive ? "답은 제출 전까지 바꿀 수 있습니다. 키보드 1~5로도 고를 수 있습니다." : "답을 고르면 바로 채점됩니다. 키보드 1~5로도 고를 수 있습니다."}</p>`;
  if(g) h += panel(n);
  h += `</div>`;
  // 이동
  if(EDIT){
    const last = cur===list.length-1;
    h += `<div class="nav"><button class="btn" ${cur===0?"disabled":""} onclick="go(-1)">이전</button><button class="btn" onclick="toggleSheet()">번호판 ${showSheet?'닫기':'보기'}</button>
      <button class="btn primary" id="nextBtn" onclick="${last?'finishEdit()':'go(1)'}">${last?'수정 마치기':'다음'}</button></div><div class="need" id="need">${missingMsg(n)}</div>`;
  } else if(examLive){
    h += `<div class="nav"><button class="btn" ${cur===0?"disabled":""} onclick="go(-1)">이전</button><button class="btn" onclick="toggleSheet()">답안지 ${showSheet?'닫기':'보기'}</button><button class="btn primary" ${cur===list.length-1?"disabled":""} onclick="go(1)">다음</button></div>`;
  } else if(exam){
    const last = cur===list.length-1;
    h += `<div class="nav"><button class="btn" ${cur===0?"disabled":""} onclick="go(-1)">이전</button><button class="btn" onclick="toggleSheet()">번호판 ${showSheet?'닫기':'보기'}</button>
      <button class="btn primary" id="nextBtn" onclick="${last?'finishReview()':'go(1)'}">${last?'기록 마치기':'다음'}</button></div><div class="need" id="need">${missingMsg(n)}</div>`;
  } else {
    const last = cur===list.length-1;
    h += `<div class="nav"><button class="btn" ${cur===0?"disabled":""} onclick="go(-1)">이전</button>
      <button class="btn primary" id="nextBtn" ${g && complete(n)?"":"disabled"} onclick="${last?'finishPractice()':'go(1)'}">${last?'결과 보기':'다음 문제'}</button></div>
      <div class="need" id="need">${g?missingMsg(n):""}</div>`;
  }
  if((exam || EDIT) && showSheet) h += sheet();
  $("#app").innerHTML = h;
  const fin = ()=>{ window.scrollTo(0, keep ? y0 : 0); if(after) after(); };
  fin();
  if(keep){ const im=document.querySelector(".qimg img"); if(im && !im.complete) im.addEventListener("load", fin, {once:true}); }
}
function panel(n){
  const p=BY[n], it=S.items[n]||{}, ok=isRight(n);
  const allowed = ok ? ["A","B"] : ["C","D"];
  const verdict = ok ? `<div class="verdict ok">✓ 정답입니다!<span>(배점 ${p.p}점)</span></div>`
    : `<div class="verdict no">✗ ${it.pick?"오답입니다.":"미응답입니다."}<span>정답은 ${CIR[p.a]}번입니다.</span></div>`;
  const rx = Object.keys(RX).map(k=>`<button class="rxb ${it.rx===k?'on':''}" data-k="${k}" ${allowed.includes(k)?"":"disabled"} onclick="setRx(${n},'${k}')"><b>${k}</b><small>${RXS[k]}</small></button>`).join("");
  const my = it.pick ? CIR[it.pick] : "미응답";
  const label = it.rx==="D" ? "정답 선지의 핵심 키워드" : "두 선지를 구분하는 근거";
  const req = it.rx ? (it.rx==="A" ? "선택" : "필수") : "";
  const ph = it.rx==="D" ? "예: 광평성 → 궁예(태봉)의 정치 기구" : it.rx==="A" ? "남길 메모가 있으면 적으세요 (생략 가능)" : "예: 원종·애노의 난은 진성여왕 때, 김헌창의 난은 헌덕왕 때";
  return `<div class="panel">${verdict}
    <div class="sec"><div class="sec-t">문항 반응<em class="${it.rx?'done':''}">${it.rx?it.rx+" 선택":"선택 필요"}</em></div><div class="rx">${rx}</div></div>
    <div class="sec"><div class="sec-t">1줄 기록 · ${label}<em class="${complete(n)?'done':''}" id="reqTag">${req}</em></div>
      <div class="meta"><b>${ROUND}-${n}</b> / ${p.e} / 내 답 ${my} · 정답 ${CIR[p.a]}</div>
      <input class="note" id="note" type="text" maxlength="160" ${it.rx?"":"disabled"} placeholder="${it.rx?ph:'문항 반응을 먼저 고르세요'}" value="${esc(it.note||"")}" oninput="setNote(${n},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();enterNext();}"></div>
    ${expBox(n)}
  </div>`;
}
function expBox(n){
  const x=expOf(n), mine=isMine(n);
  if(editExp===n){
    return `<div class="sec exp-box"><div class="sec-t">해설 작성</div>
      <textarea class="exp-edit" id="expEdit" placeholder="이 문항의 해설을 적으세요." oninput="expDraft=this.value">${esc(expDraft)}</textarea>
      <div class="exp-btns">${mine?`<button class="btn ghost" onclick="revertExp(${n})">원래대로</button>`:""}<button class="btn" onclick="cancelExp()">취소</button><button class="btn primary" onclick="saveExp(${n})">저장</button></div></div>`;
  }
  return `<div class="sec exp-box"><div class="sec-t">해설<span class="exp-act">${mine?`<span class="exp-mine">작성함 · 반영 전</span>`:""}<button class="linkish" onclick="startExp(${n})">${x?"수정":"작성"}</button></span></div>
    ${x?`<div class="exp">${esc(x)}</div>`:`<div class="exp none">이 문항은 정리된 해설이 없습니다.</div>`}</div>`;
}
function sheet(){
  const list=qList(), done=S.submitted||EDIT;
  return `<div class="sheet">` + list.map((n,idx)=>{
    const it=S.items[n]||{}; let c="cell";
    if(done){ c += isRight(n)?" ok":" no"; if(!complete(n)) c+=" pending"; }
    else if(it.pick) c+=" filled";
    if(idx===qCur()) c+=" cur";
    return `<button class="${c}" onclick="jump(${idx})"><b>${n}</b>${it.pick?CIR[it.pick]:"&nbsp;"}</button>`;
  }).join("") + `</div>` + (done?`<p class="muted" style="margin-top:6px">• 표시는 아직 반응 분류나 1줄 기록이 남은 문항입니다.</p>`:"");
}

/* ---------- 동작 ---------- */
function pick(n,k){
  if(graded(n)) return;
  item(n).pick=k; persist();
  renderQuiz(true, S.mode==="practice" ? ()=>{ const pn=document.querySelector(".panel"); if(pn) pn.scrollIntoView({block:"nearest"}); } : null);
}
function setRx(n,k){ const it=item(n); it.rx=k; S.updatedAt=Date.now(); persist(); renderQuiz(true, ()=>{ const f=$("#note"); if(f && k!=="A") f.focus({preventScroll:true}); }); }
function setNote(n,v){
  item(n).note=v; S.updatedAt=Date.now(); clearTimeout(setNote._h); setNote._h=setTimeout(persist,400);
  const b=$("#nextBtn"); if(b && S.mode==="practice") b.disabled=!complete(n);
  const need=$("#need"); if(need) need.textContent=missingMsg(n);
  const tag=$("#reqTag"); if(tag) tag.classList.toggle("done",complete(n));
}
function enterNext(){ const b=$("#nextBtn"); if(b && !b.disabled) b.click(); }
function go(d){
  const list=qList();
  if(EDIT){ editExp=null; EDIT.cur=Math.min(list.length-1,Math.max(0,EDIT.cur+d)); renderQuiz(); return; }
  if(S.mode==="practice" && d>0 && !complete(list[S.cur])) return;
  editExp=null;
  S.cur=Math.min(list.length-1,Math.max(0,S.cur+d)); persist(); renderQuiz();
}
function jump(i){ editExp=null; if(EDIT){ EDIT.cur=i; renderQuiz(); return; } S.cur=i; persist(); renderQuiz(); }
function toggleSheet(){ showSheet=!showSheet; const y=window.scrollY; renderQuiz(); if(showSheet) document.querySelector(".sheet").scrollIntoView({block:"center"}); else window.scrollTo(0,y); }
function submitExam(auto){
  const list=nums(S), blank=list.filter(n=>!(S.items[n]&&S.items[n].pick)).length;
  if(!auto && !confirm(blank ? `아직 ${blank}문항을 비워 두었습니다. 제출할까요?` : "제출하고 채점할까요?")) return;
  S.submitted=true; S.examUsedMs=Math.min(S.examMs,EXAM_MS); S.cur=0; showSheet=true; persist(); renderQuiz();
  toast(auto ? "80분이 지나 자동 제출했습니다." : "제출했습니다. 문항별 기록을 남기세요.");
}
function finishPractice(){ if(!complete(nums(S)[S.cur])) return; S.finished=true; S.endedAt=Date.now(); persist(); renderResult(S); }
function finishReview(){
  const left=nums(S).filter(n=>!complete(n)).length;
  if(left && !confirm(`기록이 남은 문항이 ${left}개입니다. 그래도 마칠까요?`)) return;
  S.finished=true; S.endedAt=Date.now(); persist(); renderResult(S);
}
function quitEarly(){
  if(S.mode==="exam"){ finishReview(); return; }
  const answered=nums(S).filter(n=>S.items[n]&&S.items[n].pick).length;
  if(!answered){ if(confirm("아직 푼 문항이 없습니다. 이 기록을 지울까요?")){ ALL=ALL.filter(x=>x.id!==S.id); saveAll(ALL); S=null; renderHome(); } return; }
  const left=nums(S).filter(n=>S.items[n]&&S.items[n].pick&&!complete(n)).length;
  if(!confirm(`${answered}문항까지 푼 것으로 마칩니다.${left?` (기록이 남은 문항 ${left}개)`:""} 결과를 볼까요?`)) return;
  S.finished=true; S.endedAt=Date.now(); persist(); renderResult(S);
}
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!S) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  const n=qList()[qCur()];
  if(/^[1-5]$/.test(e.key) && !graded(n)) pick(n,+e.key);
  else if(/^[abcdABCD]$/.test(e.key) && graded(n)){ const k=e.key.toUpperCase(); const ok=isRight(n); if((ok&&"AB".includes(k))||(!ok&&"CD".includes(k))) setRx(n,k); }
  else if(e.key==="ArrowRight"){ if(EDIT||S.mode!=="practice"||complete(n)) go(1); }
  else if(e.key==="ArrowLeft") go(-1);
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden) persist(); });

/* ---------- 통계 ---------- */
function stats(s){
  const list = s.mode==="exam" ? nums(s) : nums(s).filter(n=>s.items[n]&&s.items[n].pick);
  let got=0,max=0,right=0; const rx={A:0,B:0,C:0,D:0}; const era={};
  list.forEach(n=>{
    const p=BY[n], it=s.items[n]||{}, ok=it.pick===p.a;
    max+=p.p; if(ok){got+=p.p;right++;}
    if(it.rx) rx[it.rx]++;
    era[p.e]=era[p.e]||{t:0,r:0}; era[p.e].t++; if(ok) era[p.e].r++;
  });
  const pending=list.filter(n=>{const it=s.items[n]||{}; return !it.rx || (it.rx!=="A" && !(it.note||"").trim());}).length;
  return {list,got,max,right,rx,era,pending};
}

/* ---------- 화면: 결과 ---------- */
function openResult(id){ const s=ALL.find(x=>x.id===id); if(s) renderResult(s); }
function renderResult(s){
  view="result"; EDIT=null;
  const st=stats(s);
  let h = mast();
  h += `<div class="summary"><h2>풀이 결과</h2><p class="muted">${modeLabel(s)}${s.mode==="exam"?` · 풀이 ${mins(s.examUsedMs||s.examMs)}분`:""}</p>
    <div class="score-circle"><span class="num">${st.got}</span><span class="label">/ ${st.max}점</span></div>
    <div class="summary-stats"><div><span class="stat-num">${st.right}</span><span class="stat-label">맞은 문제</span></div>
      <div><span class="stat-num">${st.list.length}</span><span class="stat-label">푼 문제</span></div>
      <div><span class="stat-num">${st.list.length?Math.round(st.right/st.list.length*100):0}%</span><span class="stat-label">정답률</span></div></div>`;
  if(s.mode==="exam"){
    const steps=[[60,"3급"],[68,""],[72,"2급 안정"],[76,""],[80,"1급"]];
    h += `<div class="ladder">` + steps.map(([v,l])=>`<div class="${st.got>=v?'hit':''}"><b>${v}</b>${l||"&nbsp;"}</div>`).join("") + `</div>`;
  }
  h += `</div>`;
  h += `<div class="counts">` + ["A","B","C","D"].map(k=>`<div><b style="color:var(--${k})">${st.rx[k]}</b>${k} ${RX[k]}</div>`).join("") + `</div>`;
  if(st.pending) h += `<p class="need" style="text-align:left">반응 분류나 1줄 기록이 빠진 문항이 ${st.pending}개 있습니다. "기록 수정"에서 채울 수 있습니다.</p>`;
  h += `<h2>시대별 정답률</h2><div class="tblwrap"><table><thead><tr><th>시대</th><th>정답</th><th>정답률</th></tr></thead><tbody>` +
    ERAS.filter(e=>st.era[e]).map(e=>{const v=st.era[e]; return `<tr><td>${e}</td><td>${v.r}/${v.t}</td><td>${Math.round(v.r/v.t*100)}%</td></tr>`;}).join("") + `</tbody></table></div>`;
  h += `<h2>코치에게 보낼 기록</h2><p class="muted" style="margin-bottom:8px">아래 내용을 복사해서 학습 코치 채팅에 그대로 붙여넣으세요.</p>
    <textarea class="out" id="out" readonly>${esc(exportText(s))}</textarea>
    <div class="nav"><button class="btn" onclick="renderHome()">처음으로</button><button class="btn" onclick="editRecord('${s.id}')">기록 수정</button><button class="btn primary" onclick="copyOut()">기록 복사</button></div>`;
  $("#app").innerHTML=h; window.scrollTo(0,0);
}
function exportText(s){
  const st=stats(s);
  const L=[];
  L.push(`[한능검 학습 기록] ${fmtDate(s.startedAt)}`);
  L.push(`회차: 제${s.round}회 / 모드: ${modeLabel(s)}${s.mode==="exam"?` / 실전 풀이 ${mins(s.examUsedMs||s.examMs)}분`:""}`);
  L.push(`점수: ${st.got}/${st.max}점 (정답 ${st.right}/${st.list.length}문항)`);
  L.push(`문항 반응: A ${st.rx.A} / B ${st.rx.B} / C ${st.rx.C} / D ${st.rx.D}${st.pending?` / 미분류·미기록 ${st.pending}`:""}`);
  L.push(`시대별 정답률: ` + ERAS.filter(e=>st.era[e]).map(e=>`${e} ${st.era[e].r}/${st.era[e].t}`).join(", "));
  const rows = k => st.list.filter(n=>(s.items[n]||{}).rx===k).map(n=>{
    const it=s.items[n], p=BY[n];
    return `${k} | ${s.round}-${n} / ${p.e} / 내 답 ${it.pick?CIR[it.pick]:"미응답"}·정답 ${CIR[p.a]} / ${(it.note||"").trim()||"(기록 없음)"}`;
  });
  const wrong=[...rows("C"),...rows("D")], confused=rows("B");
  L.push(""); L.push("[오답 1줄 기록]"); L.push(...(wrong.length?wrong:["없음"]));
  L.push(""); L.push("[헷갈렸는데 맞은 문항]"); L.push(...(confused.length?confused:["없음"]));
  const memo = st.list.filter(n=>{const it=s.items[n]||{}; return it.rx==="A" && (it.note||"").trim();}).map(n=>`A | ${s.round}-${n} / ${BY[n].e} / ${s.items[n].note.trim()}`);
  if(memo.length){ L.push(""); L.push("[메모]"); L.push(...memo); }
  const unrx = st.list.filter(n=>!(s.items[n]||{}).rx);
  if(unrx.length){ L.push(""); L.push(`[반응 미분류] ` + unrx.map(n=>`${s.round}-${n}`).join(", ")); }
  return L.join("\n");
}
function copyOut(){
  const t=$("#out"); const txt=t.value;
  const fallback=()=>{ t.removeAttribute("readonly"); t.select(); try{document.execCommand("copy"); toast("복사했습니다.");}catch(e){ toast("길게 눌러 직접 복사하세요."); } t.setAttribute("readonly",""); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(()=>toast("복사했습니다."),fallback); } else fallback();
}

/* ---------- 백업 ---------- */
function backup(){
  const blob=new Blob([JSON.stringify(ALL)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`한능검_기록백업_${fmtDate(Date.now()).slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function restore(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const arr=JSON.parse(r.result); if(!Array.isArray(arr)) throw 0;
      // 같은 기록(id)은 나중에 고친 쪽을 남긴다 (마친 기록도 수정 가능하므로)
      const ts=x=>x.updatedAt||x.endedAt||x.startedAt||0;
      let add=0, upd=0; arr.forEach(x=>{ if(!x || !x.id) return; const i=ALL.findIndex(y=>y.id===x.id);
        if(i<0){ ALL.push(x); add++; } else if(ts(x)>ts(ALL[i])){ ALL[i]=x; upd++; } });
      saveAll(ALL); toast(`기록 ${add}개를 불러왔습니다.`+(upd?` (${upd}개는 더 최근에 고친 기록으로 바꿈)`:"")); renderHome();
    }catch(e){ toast("백업 파일 형식이 맞지 않습니다."); } };
  r.readAsText(f); inp.value="";
}

renderHome();
</script>
